<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <style>
    /* 1. THE CURSOR ANIMATION */
    @keyframes blinkSequence {
      0%, 49% { opacity: 1; }   /* Visible */
      50%, 99% { opacity: 0; }  /* Invisible */
      100% { opacity: 0; }      /* Stay Invisible at the end */
    }

    /* 2. THE LETTER 'A' REVEAL */
    @keyframes appearSequence {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    .cursor {
      /* Blinks 5 times (1s per blink), then stays hidden */
      animation: blinkSequence 1s steps(1) 5 forwards;
    }

    .final-letter {
      opacity: 0; /* Start hidden */
      /* Wait 5s (delay), then instantly appear (0s duration), stay visible */
      animation: appearSequence 0s linear 5s forwards; 
    }
  </style>

  <rect width="512" height="512" rx="60" fill="#1a1a1a"/>

  <text x="35%" y="60%" dominant-baseline="middle" text-anchor="middle" 
        font-family="monospace" font-weight="bold" font-size="300" fill="#00ff00">
    Z
  </text>

  <text x="78%" y="60%" dominant-baseline="middle" text-anchor="middle" 
        font-family="monospace" font-weight="bold" font-size="300" fill="#00ff00" class="cursor">
    _
  </text>
  
  <text x="78%" y="60%" dominant-baseline="middle" text-anchor="middle" 
        font-family="monospace" font-weight="bold" font-size="300" fill="#00ff00" class="final-letter">
    A
  </text>
</svg>