<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stargazing Portfolio</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Canvas for star background -->
  <canvas id="starfield"></canvas>

  <!-- Satellite Animation -->
  <!-- Satellite Animation handled by JS -->

  <!-- Satellite Animation handled by JS -->

  <!-- Constellation lines layer -->
  <svg id="constellation-lines" class="constellation-layer"></svg>

  <!-- Central hub (future Instagram link) -->
  <div id="central-hub" class="central-hub">
    <div class="hub-glow"></div>
  </div>

  <!-- Container for nebulae (trips) -->
  <div id="nebulae-container"></div>

  <!-- Black Hole Mode Toggle Button -->
  <button id="black-hole-toggle" class="black-hole-btn" title="Toggle Black Hole Mode">
    <canvas id="black-hole-icon" width="60" height="60"></canvas>
  </button>

  <!-- Reset Button (appears when black hole is active) -->
  <button id="black-hole-reset" class="black-hole-reset-btn hidden" title="Reset Black Hole">
    ↺
  </button>

  <!-- Detail view carousel -->
  <div id="trip-detail-view" class="hidden">
    <div class="carousel-container">
      <div class="slide" id="carousel-slide">
        <!-- Items dynamically inserted by JS -->
      </div>
      <div class="carousel-content" id="carousel-content">
        <div class="name" id="detail-title"></div>
        <div class="des" id="detail-notes"></div>
        <div class="meta">
          <span id="detail-date"></span> · <span id="detail-location"></span>
        </div>
      </div>
      <div class="carousel-buttons">
        <button class="carousel-prev"><i class="fa-solid fa-arrow-left"></i></button>
        <button class="carousel-next"><i class="fa-solid fa-arrow-right"></i></button>
      </div>
      <button id="close-detail" class="close-detail-btn">&times;</button>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
